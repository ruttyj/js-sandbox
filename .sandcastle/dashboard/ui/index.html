<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sandcastle Mission Control</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c5cff' stroke-width='2' stroke-linejoin='round'%3E%3Cpath d='M3 21V8l2-1V4h2v2h2V4h2v2h2V4h2v2h2V4h2v3l2 1v13z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l2-1V4h2v2h2V4h2v2h2V4h2v2h2V4h2v3l2 1v13z"/><path d="M10 21v-4a2 2 0 0 1 4 0v4"/><line x1="3" y1="11" x2="21" y2="11"/></svg>
                </span>
                <div>
                    <div class="brand-name">Sandcastle</div>
                    <div class="brand-sub">Agent Mission Control</div>
                </div>
            </div>
            <div id="phase-track" class="phase-track"></div>
            <div id="kpis" class="kpis"></div>
            <div id="run-controls" class="run-controls"></div>
        </header>

        <aside class="panel roster">
            <div class="panel-head">Agents <span id="roster-count" class="count"></span></div>
            <div id="roster" class="roster-list"></div>
        </aside>

        <main class="panel stage">
            <div id="stage-overview" class="overview"></div>

            <section id="stage-agent" class="agent-view" hidden>
                <div id="agent-header" class="agent-header"></div>
                <nav id="agent-tabs" class="tabs"></nav>

                <div class="agent-body">
                    <div id="tab-activity" class="tab-panel tab-activity">
                        <div id="feed-filters" class="feed-filters"></div>
                        <div id="feed" class="feed" data-filter="all"></div>
                        <button id="jump-latest" class="jump-latest" hidden>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
                            Jump to latest
                        </button>
                    </div>
                    <div id="tab-changes" class="tab-panel tab-changes" hidden></div>
                    <div id="tab-plan" class="tab-panel tab-plan" hidden></div>
                </div>
            </section>
        </main>

        <aside class="rail">
            <section id="gate-panel" class="panel gate-panel" hidden></section>
            <section class="panel">
                <div class="panel-head">Supervisor <span id="alert-count" class="count count-alert"></span></div>
                <div id="alerts" class="alerts"></div>
            </section>
            <section class="panel">
                <div class="panel-head">Conflict radar</div>
                <div id="conflicts" class="conflicts"></div>
            </section>
            <section class="panel rail-grow">
                <div class="panel-head">Run log</div>
                <div id="run-log" class="run-log"></div>
            </section>
        </aside>

        <footer class="panel timeline">
            <div id="timeline"></div>
        </footer>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <dialog id="confirm-dialog" class="dialog">
        <form method="dialog">
            <h2 class="dialog-title"></h2>
            <p class="dialog-body"></p>
            <div class="dialog-actions">
                <button class="btn btn-ghost" value="cancel">Cancel</button>
                <button class="btn btn-primary" value="confirm"></button>
            </div>
        </form>
    </dialog>

    <script type="module" src="js/main.js"></script>
</body>
</html>
