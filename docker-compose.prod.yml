# Production on a VPS: Traefik serves https://${DOMAIN} with a Let's Encrypt certificate and
# forwards to the app, which is no longer published on a port of its own.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Needs DOMAIN, ACME_EMAIL, SESSION_SECRET and the GOOGLE_* settings in .env, and the domain's DNS
# pointing at this server (ports 80 and 443 open).
services:
  app:
    ports: !reset []
    environment:
      NODE_ENV: production
      BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: 1
    labels:
      - traefik.enable=true
      - traefik.http.routers.ge-tracker.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.ge-tracker.entrypoints=websecure
      - traefik.http.routers.ge-tracker.tls.certresolver=letsencrypt
      - traefik.http.services.ge-tracker.loadbalancer.server.port=3000

  traefik:
    # v3.6.1+ works with Docker Engine 29, which dropped the older API versions Traefik used.
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    restart: unless-stopped

volumes:
  traefik-letsencrypt:
